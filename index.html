<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo - Vision Companion</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#6c5ce7">
    
    <!-- iOS PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Halo">
    
    <!-- Description for accessibility -->
    <meta name="description" content="Voice-powered vision assistant for visually impaired users. Describe scenes, read text, and navigate with confidence.">
    
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌟 Halo</h1>
            <p>Your Vision Companion</p>
        </header>

        <main>
            <div class="controls">
                <!-- TODO: Add hold-to-speak button -->
                <button id="voiceBtn" 
                        class="btn-primary"
                        aria-label="Hold to speak to Halo. Long press to ask questions about your surroundings.">
                    🎤 Hold to Speak
                </button>

                <!-- TODO: Add capture image button -->
                <button id="captureBtn" 
                        class="btn-secondary"
                        aria-label="Capture scene. Tap to take a photo and hear description of your surroundings.">
                    📷 Capture Scene
                </button>
            </div>

            <div class="status">
                <p id="statusText">Ready</p>
            </div>

            <div class="transcript">
                <h3>Conversation</h3>
                <div id="transcriptLog"></div>
            </div>
        </main>

        <!-- Hidden camera element -->
        <video id="camera" style="display:none;" autoplay></video>
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
