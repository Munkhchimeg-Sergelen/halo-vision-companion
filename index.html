<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo - Vision Companion</title>
    <link rel="stylesheet" href="/styles/main.css">
</head>
<body>
    <div class="app-container">
        <!-- Top Half: Conversation Button -->
        <button id="conversationBtn" 
                class="half-button conversation-btn"
                aria-label="Conversation with Halo. Click to start or stop conversation. Speak naturally and Halo will respond."
                role="button"
                aria-pressed="false">
            <div class="button-content">
                <span class="icon" aria-hidden="true">💬</span>
                <span class="label">Start Conversation</span>
                <span class="status-indicator" id="conversationStatus">Click to begin</span>
            </div>
        </button>

        <!-- Bottom Half: Camera Button -->
        <button id="cameraBtn" 
                class="half-button camera-btn"
                aria-label="Capture scene. Click to take a photo and hear what Halo sees. Works during conversation."
                role="button">
            <div class="button-content">
                <span class="icon" aria-hidden="true">📷</span>
                <span class="label">Capture Scene</span>
                <span class="status-indicator" id="cameraStatus">Take a photo</span>
            </div>
        </button>

        <!-- Status overlay for feedback -->
        <div id="statusOverlay" class="status-overlay" role="status" aria-live="polite">
            <p id="statusText">Ready</p>
        </div>

        <!-- Camera preview overlay -->
        <div id="cameraPreview" class="camera-preview">
            <video id="camera" autoplay playsinline></video>
            <div class="camera-overlay">
                <div class="camera-frame"></div>
            </div>
        </div>

        <!-- Hidden canvas for capture -->
        <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
