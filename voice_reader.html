<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo Vision Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            color: #fff;
        }
        
        .logo {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin-bottom: 24px;
            box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4);
            animation: pulse 2s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); box-shadow: 0 20px 60px rgba(102, 126, 234, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 25px 80px rgba(102, 126, 234, 0.6); }
        }
        
        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(90deg, #fff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }
        
        .subtitle {
            color: rgba(255,255,255,0.6);
            font-size: 1.1rem;
            font-weight: 300;
            margin-bottom: 40px;
            text-align: center;
        }
        
        .container {
            max-width: 700px;
            width: 100%;
        }
        
        .main-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 20px 40px;
            border-radius: 16px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-bottom: 30px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }
        
        .main-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 50px rgba(102, 126, 234, 0.5);
        }
        
        .main-btn .icon {
            font-size: 1.5rem;
        }
        
        .card {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            backdrop-filter: blur(20px);
            transition: all 0.3s;
        }
        
        .card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
        }
        
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }
        
        .card-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
        }
        
        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }
        
        .text-content {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 12px;
            padding: 18px;
            font-size: 0.9rem;
            line-height: 1.7;
            max-height: 180px;
            overflow-y: auto;
            white-space: pre-wrap;
            margin-bottom: 16px;
            color: rgba(255,255,255,0.85);
            border: 1px solid rgba(255,255,255,0.05);
        }
        
        .text-content::-webkit-scrollbar {
            width: 6px;
        }
        
        .text-content::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }
        
        .card-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.3);
        }
        
        .stop-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 30px rgba(245, 87, 108, 0.3);
        }
        
        .stop-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(245, 87, 108, 0.4);
        }
        
        .status {
            text-align: center;
            margin-top: 24px;
            padding: 16px 24px;
            border-radius: 12px;
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            font-weight: 500;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 10px;
            height: 10px;
            background: #4ade80;
            border-radius: 50%;
            animation: blink 1.5s ease-in-out infinite;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        .speaking .status-dot {
            background: #fbbf24;
        }
    </style>
</head>
<body>
    <div class="logo">👁️</div>
    <h1>Halo Vision Companion</h1>
    <p class="subtitle">Your friendly clinical assistant for navigation</p>
    
    <div class="container">
        <button class="main-btn" onclick="readAll()">
            <span class="icon">🔊</span>
            Read All Outputs
        </button>
        
        <div class="card">
            <div class="card-header">
                <div class="card-icon">📷</div>
                <h2>Vision Analysis</h2>
            </div>
            <div class="text-content" id="vision-text">Loading...</div>
            <button class="card-btn" onclick="speakVision()">
                <span>🔊</span> Read This
            </button>
        </div>
        
        <div class="card">
            <div class="card-header">
                <div class="card-icon">🍽️</div>
                <h2>Menu & Cash Analysis</h2>
            </div>
            <div class="text-content" id="menu-text">Loading...</div>
            <button class="card-btn" onclick="speakMenu()">
                <span>🔊</span> Read This
            </button>
        </div>
        
        <button class="stop-btn" onclick="stopSpeaking()">⏹️ Stop Speaking</button>
        
        <div class="status" id="status">
            <div class="status-dot"></div>
            <span id="status-text">Ready</span>
        </div>
    </div>

    <script>
        // Text content from files
        let visionText = '';
        let menuText = '';
        
        const welcomeMessage = "Welcome to Halo Vision Companion. I'm your friendly clinical assistant. I will now read the analysis of your surroundings.";
        
        // Load the text files and auto-read
        async function loadTexts() {
            // Vision output (from IMG_5438.txt)
            visionText = `Hello! Let me help you understand your surroundings.

In front of you, there are a few potted plants that add a nice touch of greenery to the space. One of them is quite close, just about five steps away, while another one is a bit further, around eight steps away. You might enjoy the fresh feel they bring to the area.

As for people, there are a couple of individuals nearby, but they are also at a distance of about eight steps away. You might hear them chatting or moving around, so just be aware of their presence as you navigate.

I can also see a chair positioned at a similar distance of eight steps away. It might be a good spot for you to sit and relax if you choose to do so.

Overall, the closest objects are the potted plants, and the others—like the people and the chair—are a bit further away. As you move, just take your time, and feel free to reach out if you need any assistance. Your safety and comfort are my top priority!`;

            // Menu/Cash output (from output1.txt)
            menuText = `The image shows a restaurant menu with various food items and prices. Here are the main sections:

Appetizers:
- Spring Rolls - $8.99
- Soup of the Day - $6.50

Main Courses:
- Grilled Salmon - $24.99
- Chicken Parmesan - $18.50
- Vegetable Stir Fry - $14.99

Desserts:
- Chocolate Cake - $7.99
- Ice Cream - $5.50

All prices include tax. Ask your server about daily specials.`;

            document.getElementById('vision-text').textContent = visionText;
            document.getElementById('menu-text').textContent = menuText;
            
            // Auto-read on load with welcome message
            await autoReadOnLoad();
        }
        
        // Auto-read welcome + all outputs
        async function autoReadOnLoad() {
            updateStatus('🎙️ Welcome...');
            await speak(welcomeMessage);
            
            updateStatus('🗣️ Reading vision analysis...');
            await speak(visionText);
            
            updateStatus('🗣️ Reading menu analysis...');
            await speak(menuText);
            
            updateStatus('✅ All done! Click any button to hear again.');
        }
        
        // Speak text using Web Speech API
        function speak(text) {
            return new Promise((resolve) => {
                if (!text || !text.trim()) {
                    resolve();
                    return;
                }
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.95;
                utterance.pitch = 1;
                
                utterance.onend = () => resolve();
                utterance.onerror = () => resolve();
                
                window.speechSynthesis.speak(utterance);
            });
        }
        
        // Stop speaking
        function stopSpeaking() {
            window.speechSynthesis.cancel();
            updateStatus('⏹️ Stopped');
        }
        
        // Read vision text
        async function speakVision() {
            updateStatus('🗣️ Reading vision analysis...');
            await speak(visionText);
            updateStatus('✅ Done');
        }
        
        // Read menu text
        async function speakMenu() {
            updateStatus('🗣️ Reading menu analysis...');
            await speak(menuText);
            updateStatus('✅ Done');
        }
        
        // Read all outputs
        async function readAll() {
            updateStatus('🗣️ Reading all...');
            await speak(welcomeMessage);
            await speak(visionText);
            await speak(menuText);
            updateStatus('✅ All done!');
        }
        
        // Update status
        function updateStatus(msg) {
            document.getElementById('status-text').textContent = msg;
        }
        
        // Load texts on page load
        window.onload = loadTexts;
    </script>
</body>
</html>
